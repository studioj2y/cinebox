<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不良陪你选电影 · CINEBOX</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- 分享卡片：被分享链接/微博/推特/微信卡片抓取 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="不良陪你选电影 · CINEBOX" />
  <meta property="og:description" content="回答 5 个关于此刻心情的小问题，让今晚那部片找到你。" />
  <meta property="og:image" content="images/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="不良陪你选电影 · CINEBOX" />
  <meta name="twitter:description" content="回答 5 个关于此刻心情的小问题，让今晚那部片找到你。" />
  <meta name="twitter:image" content="images/og-cover.png" />
  <meta name="description" content="回答 5 个关于此刻心情的小问题，让今晚那部片找到你。" />
</head>
<body>
  <!-- 全局视觉层 -->
  <div class="fx fx-aurora" aria-hidden="true"></div>
  <div class="fx fx-grain" aria-hidden="true"></div>
  <div class="fx fx-vignette" aria-hidden="true"></div>
  <div class="fx fx-cursor" id="fxCursor" aria-hidden="true"></div>
  <div class="brand-mark">CINE<b>BOX</b></div>

  <!-- 海报墙首屏 -->
  <section id="wall" class="screen active">
    <div class="wall-overlay"></div>
    <div class="wall-rows" id="wallRows"></div>
    <div class="hero">
      <div class="hero-step"><span class="dot"></span>聊聊此刻的你</div>
      <div class="hero-title-wrap">
        <h1>不良陪你选电影</h1>
      </div>
      <p class="tagline">回答 5 个关于此刻心情的小问题，让今晚那部片找到你。</p>
      <div class="hero-cta-zone">
        <img class="hero-logo" src="images/logo-silhouette.png" alt="" aria-hidden="true" />
        <button id="startBtn" class="cta">开始挑片 →</button>
      </div>
    </div>
  </section>

  <!-- 答题屏 -->
  <section id="quiz" class="screen">
    <div class="quiz-wrap">
      <div class="quiz-top">
        <button id="backBtn" class="ghost">← 返回</button>
        <div class="progress"><div id="progressBar"></div></div>
        <div class="q-count"><span id="qNow">1</span>/<span id="qTotal">5</span></div>
      </div>
      <div class="reply-stream" id="replyStream"></div>
      <div class="quiz-card" id="quizCard">
        <div class="q-cat" id="qCat"></div>
        <h2 id="qText"></h2>
        <div id="qOptions" class="options"></div>
      </div>
    </div>
    <!-- 回复浮现的「幽灵层」：独立于问题卡，避免被其溶解滤镜糊掉；居中于视口，回复在此由模糊逐渐清晰形成 -->
    <div class="ghost-layer" id="ghostLayer" aria-hidden="true"></div>
  </section>

  <!-- 结果屏 -->
  <section id="result" class="screen">
    <div class="marquee"><div class="marquee-track">
      <span>NOW SHOWING · <b>今晚的片</b></span><span>不良少女放映组</span><span>CINEBOX</span><span>把今晚交给一部电影</span>
      <span>NOW SHOWING · <b>今晚的片</b></span><span>不良少女放映组</span><span>CINEBOX</span><span>把今晚交给一部电影</span>
    </div></div>
    <div class="result-wrap">
      <div class="result-poster">
        <img id="rPoster" alt="" />
        <div id="rFallback" class="poster-fallback"></div>
      </div>
      <div class="result-info">
        <div class="r-kicker">给你的今晚</div>
        <h2 id="rTitle"></h2>
        <div class="r-meta" id="rMeta"></div>
        <div class="r-ratings" id="rRatings"></div>
        <div class="r-tags" id="rTags"></div>
        <p class="r-overview" id="rOverview"></p>
        <div class="r-reason">
          <span class="r-reason-label">为什么是它</span>
          <p id="rReason"></p>
        </div>
        <div class="r-actions">
          <button id="againBtn" class="ghost">换一部 ↻</button>
          <button id="retestBtn" class="ghost">重新测</button>
          <button id="aiBtn" class="cta ai-cta" title="把你的回答和这部片串成一段话">✦ 不良有话说</button>
          <button id="posterBtn" class="ghost">📸 生成分享海报</button>
        </div>
        <pre id="aiPrompt" class="ai-prompt" hidden></pre>
        <div id="qrCta" class="qr-cta" hidden>
          <div class="qr-text">扫码关注<span class="qr-hl">不良少女放映组</span>，陪你一起看电影。</div>
          <div class="qr-img-wrap"><img class="qr-img" src="images/qrcode.jpg" alt="扫码关注不良少女放映组" /></div>
        </div>
        <div id="posterArea" class="poster-area" hidden>
          <div id="posterStatus" class="poster-status" hidden></div>
          <img id="posterImg" class="poster-img" alt="CINEBOX 分享海报，可长按保存" hidden />
        </div>
      </div>
    </div>
  </section>

  <script src="data/movies.js"></script>
  <script src="data/questions.js"></script>
  <script src="js/match.js"></script>
  <!-- html2canvas 不在此处引入：仍有 194KB，但只有点「生成海报」才需要，
       由 js/app.js 的 loadHtml2Canvas() 在点击时按需注入，首屏可减少 194KB。
       自托管的原因不变：原从 cdnjs 加载，国内常拉不到导致海报生成直接失败。 -->
  <script src="js/app.js"></script>
</body>
</html>
