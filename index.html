<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不良陪你选电影 · CINEBOX</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 全局视觉层 -->
  <div class="fx fx-aurora" aria-hidden="true"></div>
  <div class="fx fx-grain" aria-hidden="true"></div>
  <div class="fx fx-vignette" aria-hidden="true"></div>
  <div class="fx fx-cursor" id="fxCursor" aria-hidden="true"></div>
  <div class="brand-mark">CINE<b>BOX</b></div>

  <!-- 海报墙首屏 -->
  <section id="wall" class="screen active">
    <div class="wall-overlay"></div>
    <div class="wall-rows" id="wallRows"></div>
    <div class="hero">
      <div class="hero-step"><span class="dot"></span>STEP 01 · 测一测今晚的你</div>
      <div class="hero-title-wrap">
        <h1>不良陪你选电影</h1>
      </div>
      <p class="tagline">回答 5 个关于此刻心情的小问题，让影单找到你。</p>
      <div class="hero-cta-zone">
        <img class="hero-logo" src="images/logo-silhouette.png" alt="" aria-hidden="true" />
        <button id="startBtn" class="cta">开始测试 →</button>
      </div>
    </div>
  </section>

  <!-- 答题屏 -->
  <section id="quiz" class="screen">
    <div class="quiz-wrap">
      <div class="quiz-top">
        <button id="backBtn" class="ghost">← 返回</button>
        <div class="progress"><div id="progressBar"></div></div>
        <div class="q-count"><span id="qNow">1</span>/<span id="qTotal">5</span></div>
      </div>
      <div class="reply-stream" id="replyStream"></div>
      <div class="quiz-card" id="quizCard">
        <div class="q-cat" id="qCat"></div>
        <h2 id="qText"></h2>
        <div id="qOptions" class="options"></div>
      </div>
    </div>
  </section>

  <!-- 结果屏 -->
  <section id="result" class="screen">
    <div class="marquee"><div class="marquee-track">
      <span>NOW SHOWING · <b>今晚的片</b></span><span>不良少女放映组</span><span>CINEBOX</span><span>把今晚交给一部电影</span>
      <span>NOW SHOWING · <b>今晚的片</b></span><span>不良少女放映组</span><span>CINEBOX</span><span>把今晚交给一部电影</span>
    </div></div>
    <div class="result-wrap">
      <div class="result-poster">
        <img id="rPoster" alt="" />
        <div id="rFallback" class="poster-fallback"></div>
      </div>
      <div class="result-info">
        <div class="r-kicker">为你选出</div>
        <h2 id="rTitle"></h2>
        <div class="r-meta" id="rMeta"></div>
        <div class="r-ratings" id="rRatings"></div>
        <div class="r-tags" id="rTags"></div>
        <p class="r-overview" id="rOverview"></p>
        <div class="r-reason">
          <span class="r-reason-label">为什么是它</span>
          <p id="rReason"></p>
        </div>
        <div class="r-actions">
          <button id="againBtn" class="ghost">换一部 ↻</button>
          <button id="retestBtn" class="ghost">重新测</button>
          <button id="aiBtn" class="cta ai-cta" title="AI 全盘解读（当前直连 agnes-ai）">✦ 不良有话说</button>
        </div>
        <pre id="aiPrompt" class="ai-prompt" hidden></pre>
      </div>
    </div>
  </section>

  <script src="data/movies.js"></script>
  <script src="data/questions.js"></script>
  <script src="js/match.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
